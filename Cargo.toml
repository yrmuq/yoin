[package]
name = "yoin"
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "KDE tray buttons for Home Assistant"
publish = false

[dependencies]
futures-util = "0.3"
ksni = "0.3"
libc = "0.2"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
resvg = { version = "=0.49.0", default-features = false, features = ["text", "raster-images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "unstable-winit-030", "image-default-formats"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
zbus = "6"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
