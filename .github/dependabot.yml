version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 * * 5"
    open-pull-requests-limit: 1
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 * * 5"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
