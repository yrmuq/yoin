# A push to main updates deps from main and keeps commits that exist only on deps.
# A conflict outside the version files stops the update. deps is never merged into main.

name: Sync deps

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: deps

      - name: Merge main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -eu
          git fetch origin main
          bash packaging/release/merge-ref.sh origin/main
          git push origin HEAD:refs/heads/deps
