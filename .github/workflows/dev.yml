# Manual Rust AppImage from the dev branch.
# It updates the draft release "yoin dev" and does not replace an X.Y.0 release.

name: Rust AppImage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev file

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: yoin-rust-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: bash packaging/appimage/build.sh

      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s\n' '**Changes:**' '' 'Development build from the dev branch. Not a public release.' > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh release delete dev --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          git tag -a dev -m "$(cat notes.md)"
          git push origin refs/tags/dev
          gh release create dev dist/yoin-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "yoin dev" \
            --notes-file notes.md
