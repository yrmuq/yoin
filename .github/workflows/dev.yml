# Every push to dev updates the existing draft release.
# It does not change the version and it does not create a tag.

name: Development build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    concurrency:
      group: yoin-dev-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev file

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: yoin-ubuntu-x64-stable-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: bash packaging/appimage/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/yoin-x86_64.AppImage
            dist/yoin-x86_64.AppImage.zsync
            dist/yoin-x86_64.AppImage.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    concurrency:
      group: yoin-dev-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: Update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -s dist/yoin-x86_64.AppImage
          test -s dist/yoin-x86_64.AppImage.zsync
          test -s dist/yoin-x86_64.AppImage.sha256
          chmod +x dist/yoin-x86_64.AppImage
          printf '%s\n' 'Development build from dev. Not a release.' > notes.md
          if ! gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "the dev draft is missing, and this job does not create a tag" >&2
            exit 1
          fi
          gh release view dev --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              yoin-x86_64.AppImage|yoin-x86_64.AppImage.zsync|yoin-x86_64.AppImage.sha256) ;;
              *) gh release delete-asset dev "$name" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
          gh release upload dev \
            dist/yoin-x86_64.AppImage \
            dist/yoin-x86_64.AppImage.zsync \
            dist/yoin-x86_64.AppImage.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit dev \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "yoin dev" \
            --notes-file notes.md
