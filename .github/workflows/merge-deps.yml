# Dependabot does not land on main. Each update replaces the previous
# patch prerelease with the next number. Merge the deps branch after trying it.

name: Dependency prerelease

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prerelease:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Tags
        run: git fetch origin --tags --force

      - uses: dtolnay/rust-toolchain@stable

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev file

      - name: Test
        run: cargo test

      - name: Tag the next prerelease
        id: tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          ver="$(bash packaging/release/prerelease.sh)"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bash packaging/appimage/build.sh

      - name: Publish and drop the previous prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${{ steps.tag.outputs.version }}"
          major="$(printf '%s\n' "$ver" | awk -F. '{ print $1 }')"
          minor="$(printf '%s\n' "$ver" | awk -F. '{ print $2 }')"
          patch="$(printf '%s\n' "$ver" | awk -F. '{ print $3 }')"
          git tag -l --format='%(contents)' "v${ver}" > notes.md
          gh release create "v${ver}" dist/yoin-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "yoin ${ver}" \
            --notes-file notes.md
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease) | .tagName' \
            | while read -r tag; do
                case "$tag" in
                  "v${major}.${minor}."*) ;;
                  *) continue ;;
                esac
                old="$(printf '%s\n' "$tag" | awk -F. '{ print $3 }' | tr -cd '0-9')"
                if [ -n "$old" ] && [ "$old" -gt 0 ] && [ "$old" -lt "$patch" ]; then
                  gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
                fi
              done
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "Prerelease [${ver}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${ver}) is ready to try. \`main\` is unchanged. Merge branch \`deps\` when it works."
