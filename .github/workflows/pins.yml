# Monday: refresh the two pins Dependabot cannot see, and merge that PR.

name: Pins

on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pins
        id: pins
        run: |
          set +e
          python3 packaging/release/update_pins.py
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != 0 ]; then
            exit "$code"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open and merge
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -eu
          python3 -m unittest discover -s tests
          git checkout -B deps/pins
          git add packaging/appimage/build.sh packaging/flatpak/io.github.yrmuq.yoin.yml .github/workflows/appimage.yml
          git commit -m "Update pinned CPython and appimagetool."
          git push --force -u origin HEAD:deps/pins
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head deps/pins \
            --title "Update pinned CPython and appimagetool." \
            --body "Automatic pin update." || true
          gh pr merge deps/pins --repo "$GITHUB_REPOSITORY" --squash --delete-branch
