# Manual only. kind=minor cuts X.(Y+1).0 from main and resets the patch.
# Dependency prereleases are published by the Dependency prerelease workflow.

name: Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: minor cuts the next manual release
        type: choice
        options:
          - minor
        default: minor

permissions:
  contents: write

jobs:
  cut:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/release/cut.sh "${{ github.event.inputs.kind || 'minor' }}"
