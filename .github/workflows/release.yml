# A merge commit from dev into main raises Y, sets Z to 0, and publishes
# that normal release. A squash or a direct commit does not.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cut:
    if: github.event.head_commit.id != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag the next minor
        id: tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          ver="$(bash packaging/release/cut.sh | tail -n 1)"
          case "$ver" in
            [0-9]*.[0-9]*.0) echo "version=${ver}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
        if: steps.tag.outputs.version != ''

      - name: Libraries
        if: steps.tag.outputs.version != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev file

      - uses: actions/cache@v6
        if: steps.tag.outputs.version != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            packaging/appimage/build/cache
          key: yoin-rust-appimage-${{ hashFiles('Cargo.lock') }}

      - name: Build
        if: steps.tag.outputs.version != ''
        run: bash packaging/appimage/build.sh

      - name: Publish
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${{ steps.tag.outputs.version }}"
          git push origin HEAD
          git push origin "refs/tags/v${ver}"
          bash packaging/release/publish.sh "v${ver}"
