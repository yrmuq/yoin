# An annotated tag vX.Y.Z builds the AppImage.
# X.Y.0 is a normal release. Any other X.Y.Z is a prerelease.
# The tag message is the release body.
# No run commands and no test-build banner. Those stay in the README.
# A manual run builds the image and does not publish a release.

name: AppImage

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev file

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            packaging/appimage/build/cache
          key: yoin-rust-appimage-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: bash packaging/appimage/build.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/release/publish.sh "$GITHUB_REF_NAME"
