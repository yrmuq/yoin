# Build the Rust AppImage for a version tag cut on main.
# A manual X.Y.0 from the dev branch is .github/workflows/dev.yml.

name: AppImage

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev file

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            packaging/appimage/build/cache
          key: yoin-rust-appimage-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: bash packaging/appimage/build.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            *-test)
              echo "leaving the old test tag alone"
              exit 0
              ;;
          esac
          VER="${TAG#v}"
          if ! printf '%s\n' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag ${TAG} is not a version" >&2
            exit 1
          fi
          case "$VER" in
            *.*.0) EXTRA=() ;;
            *) EXTRA=(--prerelease) ;;
          esac
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "the annotated tag message is the release notes, and it is empty" >&2
            exit 1
          fi
          if grep -E 'Test build|chmod |\./yoin' notes.md; then
            echo "release notes must not include run commands or a test-build banner" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/yoin-x86_64.AppImage \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${EXTRA[@]}" \
              --title "yoin ${VER}" \
              --notes-file notes.md
          else
            gh release create "$TAG" dist/yoin-x86_64.AppImage \
              --repo "$GITHUB_REPOSITORY" \
              "${EXTRA[@]}" \
              --title "yoin ${VER}" \
              --notes-file notes.md
          fi
